{% extends "base.html" %}{% block c %}<h2>{{ c.title }}</h2><p class="muted">{{ c.description }}</p>
{% for l in ls %}<a href="/lesson/{{ l.id }}" style="text-decoration:none;color:inherit"><div class="card row"><span>{{ l.title }}</span>
