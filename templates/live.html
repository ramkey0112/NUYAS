{% extends "base.html" %}{% block t %}Live{% endblock %}{% block c %}
<style>
.dx{--gx:var(--g,#16a36a);--cx:var(--card,#fff);--lx:var(--line,rgba(128,128,128,.22));
  font-size:12.5px;line-height:1.55;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.dx *{box-sizing:border-box}
.dx p{margin:0}

.dx .hero{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px 14px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--gold) 42%,transparent),transparent 55%),
             linear-gradient(135deg,#0d5c43,#0a3d2e 65%,#062a1f);
  box-shadow:0 12px 28px -12px rgba(10,61,46,.75)}
.dx .hero::after{content:"";position:absolute;right:-28px;top:-28px;width:110px;height:110px;border-radius:50%;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 14px rgba(255,255,255,.04)}
.dx .hero .badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;
  background:#dc2626;color:#fff;position:relative;z-index:1;letter-spacing:.4px}
.dx .hero .badge i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.dx .hero h1{margin:8px 0 2px;font-size:20px;font-weight:700;line-height:1.2;position:relative;z-index:1}
.dx .hero p{font-size:11.5px;opacity:.82;position:relative;z-index:1}

/* ===== CUSTOM PLAYER ===== */
.dx .pw{position:relative;border-radius:16px;overflow:hidden;background:#050d0a;
  border:1px solid var(--lx);box-shadow:0 10px 32px -12px rgba(0,0,0,.5);aspect-ratio:16/9;user-select:none}
.dx .pw video{width:100%;height:100%;display:block;background:#000;object-fit:contain;
  pointer-events:none}

/* Loading */
.dx .pw .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,13,10,.75);z-index:5;transition:opacity .25s}
.dx .pw .load.hide{opacity:0;pointer-events:none}
.dx .pw .spin{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--g-light,#34d399);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Live badge on player */
.dx .pw .ltag{position:absolute;top:12px;left:12px;z-index:6;display:inline-flex;align-items:center;gap:5px;
  background:rgba(220,38,38,.95);color:#fff;font-size:10px;font-weight:700;padding:4px 9px;border-radius:6px;
  letter-spacing:.35px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.dx .pw .ltag i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1s infinite}

/* Custom controls bar */
.dx .pw .bar{position:absolute;left:0;right:0;bottom:0;z-index:7;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  padding:28px 12px 10px;display:flex;align-items:center;gap:10px;
  opacity:0;transition:opacity .25s}
.dx .pw:hover .bar,.dx .pw.show-bar .bar{opacity:1}
.dx .pw .bar button{background:none;border:none;color:#fff;padding:6px;cursor:pointer;border-radius:8px;
  display:grid;place-items:center;transition:background .15s;flex:none}
.dx .pw .bar button:hover{background:rgba(255,255,255,.12)}
.dx .pw .bar button:active{transform:scale(.94)}
.dx .pw .bar .meta{flex:1;min-width:0;color:#fff}
.dx .pw .bar .meta b{display:block;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx .pw .bar .meta span{font-size:10px;opacity:.7}
.dx .pw .bar .vol{width:70px;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.25);
  border-radius:99px;outline:none;cursor:pointer}
.dx .pw .bar .vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* Center play big button when paused */
.dx .pw .bigplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;
  background:rgba(0,0,0,.35);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.dx .pw.paused .bigplay{opacity:1;pointer-events:auto}
.dx .pw .bigplay .c{width:64px;height:64px;border-radius:50%;background:rgba(5,150,105,.92);
  display:grid;place-items:center;color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.45);
  transition:transform .15s}
.dx .pw .bigplay:hover .c{transform:scale(1.06)}

/* Channel cards — theme-safe text colors */
.dx .sec{display:flex;align-items:center;margin:2px 2px -2px}
.dx .sec h3{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--ink)}
.dx .sec h3::before{content:"";width:3px;height:14px;border-radius:3px;background:linear-gradient(var(--gx),var(--gold))}
.dx .ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.dx .ch-grid{grid-template-columns:repeat(4,1fr)}}
.dx .ch{display:flex;flex-direction:column;gap:7px;text-align:left;background:var(--cx);border:1.5px solid var(--lx);
  border-radius:14px;padding:12px 11px;cursor:pointer;transition:all .18s;position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px -10px rgba(0,0,0,.18);color:var(--ink);font:inherit}
.dx .ch:hover{border-color:color-mix(in srgb,var(--gx) 45%,var(--lx));transform:translateY(-1px)}
.dx .ch:active{transform:scale(.98)}
.dx .ch.on{border-color:var(--gx);background:color-mix(in srgb,var(--gx) 9%,var(--cx));
  box-shadow:0 0 0 1px var(--gx),0 8px 20px -10px color-mix(in srgb,var(--gx) 35%,transparent)}
.dx .ch .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb,var(--gx) 12%,transparent);color:var(--gx)}
.dx .ch.on .ico{background:var(--gx);color:#fff}
.dx .ch b{font-size:12px;font-weight:700;line-height:1.25;display:block;color:var(--ink)}
.dx .ch span{font-size:10.5px;color:var(--mut);line-height:1.35;display:block;margin-top:2px}
.dx .ch .dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--mut-2);opacity:.5}
.dx .ch.on .dot{background:#dc2626;opacity:1;box-shadow:0 0 0 3px rgba(220,38,38,.22);animation:blink 1.2s infinite}
</style>

<div class="dx">
  <div class="hero">
    <span class="badge"><i></i> LIVE</span>
    <h1>Live — Makkah & Qurani</h1>
    <p>Tazama moja kwa moja kutoka Makkah na channel za Qurani.</p>
  </div>

  <div class="pw paused" id="pw">
    <div class="ltag"><i></i> LIVE</div>
    <video id="vplayer" playsinline webkit-playsinline></video>
    <div class="load" id="load"><div class="spin"></div></div>
    <div class="bigplay" id="bigplay"><div class="c">{{ icon('play',28) }}</div></div>
    <div class="bar" id="bar">
      <button type="button" id="btnPlay" aria-label="Play">{{ icon('play',20) }}</button>
      <div class="meta">
        <b id="chTitle">—</b>
        <span id="chSub">—</span>
      </div>
      <button type="button" id="btnMute" aria-label="Sauti">🔊</button>
      <input type="range" class="vol" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <button type="button" id="btnFs" aria-label="Fullscreen">⛶</button>
    </div>
  </div>

  <div class="sec"><h3>Channels</h3></div>
  <div class="ch-grid" id="chGrid">
    {% for s in streams %}
    <button type="button" class="ch" data-type="iptv" data-src="{{ s.url }}" data-title="{{ s.title }}" data-sub="{{ s.subtitle }}">
      <div class="ico">{% if s.key=='quran_tv' %}📖{% elif s.key=='makkah' %}🕋{% else %}🕌{% endif %}</div>
      <div>
        <b>{{ s.title }}</b>
        <span>{{ s.subtitle }}</span>
      </div>
      <span class="dot"></span>
    </button>
    {% endfor %}
    <button type="button" class="ch" data-type="tafsiri" data-title="Qurani Tafsiri" data-sub="Video za tafsiri">
      <div class="ico">📚</div>
      <div>
        <b>Qurani Tafsiri</b>
        <span>Video zinazocheza kwa mfululizo</span>
      </div>
      <span class="dot"></span>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
(function(){
  const video = document.getElementById('vplayer');
  const pw = document.getElementById('pw');
  const load = document.getElementById('load');
  const bigplay = document.getElementById('bigplay');
  const btnPlay = document.getElementById('btnPlay');
  const btnMute = document.getElementById('btnMute');
  const btnFs = document.getElementById('btnFs');
  const vol = document.getElementById('vol');
  const chTitle = document.getElementById('chTitle');
  const chSub = document.getElementById('chSub');
  const cards = [...document.querySelectorAll('#chGrid .ch')];
  const tafsiriList = {{ tafsiri|tojson }};
  let hls = null;
  let mode = null;
  let tafsiriIdx = 0;
  let hideBarTimer = null;

  const playIcon = `{{ icon('play',20) }}`;
  const pauseIcon = `<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;

  function showLoad(on){ load.classList.toggle('hide', !on); }
  function setPaused(p){
    pw.classList.toggle('paused', p);
    btnPlay.innerHTML = p ? playIcon : pauseIcon;
  }
  function showBar(){
    pw.classList.add('show-bar');
    clearTimeout(hideBarTimer);
    hideBarTimer = setTimeout(()=>{ if(!video.paused) pw.classList.remove('show-bar'); }, 3200);
  }

  function stopHls(){
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
    video.removeAttribute('src');
    video.load();
  }

  function playIptv(src, title, sub){
    mode = 'iptv';
    stopHls();
    video.loop = false;
    chTitle.textContent = title;
    chSub.textContent = sub;
    showLoad(true);
    setPaused(true);

    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ enableWorker:true, lowLatencyMode:true, maxBufferLength:30 });
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
        video.play().then(()=>{ setPaused(false); showLoad(false); }).catch(()=>{ showLoad(false); setPaused(true); });
      });
      hls.on(Hls.Events.ERROR, (e, data)=>{
        if(data.fatal){ showLoad(false); setPaused(true); }
      });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = src;
      video.addEventListener('loadedmetadata', ()=>{
        video.play().then(()=>{ setPaused(false); showLoad(false); }).catch(()=>{ showLoad(false); setPaused(true); });
      }, {once:true});
    } else {
      showLoad(false);
    }
  }

  function playTafsiriAt(i){
    if(!tafsiriList.length){
      chTitle.textContent = 'Qurani Tafsiri';
      chSub.textContent = 'Hakuna video bado';
      showLoad(false);
      setPaused(true);
      return;
    }
    mode = 'tafsiri';
    stopHls();
    tafsiriIdx = ((i % tafsiriList.length) + tafsiriList.length) % tafsiriList.length;
    const v = tafsiriList[tafsiriIdx];
    chTitle.textContent = v.title || 'Tafsiri';
    chSub.textContent = 'Namba ' + (v.position || (tafsiriIdx+1));
    showLoad(true);
    video.loop = false;
    video.src = v.video_url;
    video.load();
    video.play().then(()=>{ setPaused(false); showLoad(false); }).catch(()=>{ showLoad(false); setPaused(true); });
  }

  video.addEventListener('waiting', ()=> showLoad(true));
  video.addEventListener('playing', ()=>{ showLoad(false); setPaused(false); });
  video.addEventListener('pause', ()=> setPaused(true));
  video.addEventListener('ended', ()=>{
    if(mode === 'tafsiri' && tafsiriList.length){
      playTafsiriAt(tafsiriIdx + 1);
    }
  });
  video.addEventListener('seeking', ()=>{
    if(mode === 'iptv' && !video.paused){
      try{ video.currentTime = video.buffered.length ? video.buffered.end(video.buffered.length-1) - 0.5 : video.currentTime; }catch(e){}
    }
  });

  btnPlay.onclick = ()=>{ if(video.paused) video.play().catch(()=>{}); else video.pause(); showBar(); };
  bigplay.onclick = ()=>{ video.play().catch(()=>{}); showBar(); };
  btnMute.onclick = ()=>{ video.muted = !video.muted; btnMute.textContent = video.muted ? '🔇' : '🔊'; showBar(); };
  vol.oninput = ()=>{ video.volume = +vol.value; video.muted = video.volume === 0; btnMute.textContent = video.muted ? '🔇' : '🔊'; };
  btnFs.onclick = ()=>{
    if(!document.fullscreenElement) pw.requestFullscreen?.() || pw.webkitRequestFullscreen?.();
    else document.exitFullscreen?.();
  };
  pw.addEventListener('click', showBar);
  pw.addEventListener('mousemove', showBar);
  pw.addEventListener('touchstart', showBar, {passive:true});

  cards.forEach(c=>{
    c.addEventListener('click', ()=>{
      cards.forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
      if(c.dataset.type === 'tafsiri'){
        playTafsiriAt(0);
      } else {
        playIptv(c.dataset.src, c.dataset.title, c.dataset.sub);
      }
    });
  });

  if(cards[0] && cards[0].dataset.type === 'iptv'){
    cards[0].classList.add('on');
    playIptv(cards[0].dataset.src, cards[0].dataset.title, cards[0].dataset.sub);
  }
})();
</script>
{% endblock %}
